<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IMPORTANTE - Lee esto ahora</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #00ff88;
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Matrix rain canvas */
    canvas {
      position: fixed;
      top: 0; left: 0;
      opacity: 0.07;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 2rem;
    }

    .warning-box {
      border: 2px solid #ff4444;
      padding: 2rem 3rem;
      background: rgba(255, 0, 0, 0.05);
      animation: borderFlash 1s infinite;
      max-width: 600px;
    }

    @keyframes borderFlash {
      0%, 100% { border-color: #ff4444; box-shadow: 0 0 10px #ff4444; }
      50% { border-color: #ff0000; box-shadow: 0 0 30px #ff0000; }
    }

    .skull { font-size: 3rem; animation: shake 0.3s infinite; }
    @keyframes shake {
      0%,100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    h1 {
      color: #ff4444;
      font-size: 1.5rem;
      margin: 1rem 0 0.5rem;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .subtitle {
      color: #aaa;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      letter-spacing: 2px;
    }

    .progress-label {
      color: #00ff88;
      font-size: 0.75rem;
      margin-bottom: 0.3rem;
      letter-spacing: 2px;
    }

    .progress-bar {
      width: 100%;
      height: 14px;
      background: #111;
      border: 1px solid #00ff88;
      overflow: hidden;
      margin-bottom: 1.5rem;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00ff88, #00ffcc);
      animation: fillBar 4s forwards;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 6px;
      background: #fff;
      filter: blur(3px);
    }

    @keyframes fillBar {
      0%   { width: 0%; }
      30%  { width: 35%; }
      60%  { width: 68%; }
      85%  { width: 89%; }
      100% { width: 100%; }
    }

    .status-text {
      font-size: 0.75rem;
      color: #555;
      letter-spacing: 1px;
      margin-bottom: 2rem;
      min-height: 1rem;
    }

    /* Hidden video frame */
    #rickContainer {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    #rickContainer.show {
      display: flex;
    }

    .rick-title {
      color: #ff4444;
      font-size: 1.2rem;
      letter-spacing: 3px;
      animation: glitch 0.5s infinite;
    }

    @keyframes glitch {
      0%,100% { text-shadow: 2px 0 #ff0000, -2px 0 #00ffff; transform: translateX(0); }
      25% { text-shadow: -2px 0 #ff0000, 2px 0 #00ffff; transform: translateX(2px); }
      75% { text-shadow: 2px 0 #00ffff, -2px 0 #ff0000; transform: translateX(-2px); }
    }

    iframe {
      border: 3px solid #ff4444;
      box-shadow: 0 0 30px #ff4444;
      max-width: 100%;
    }

    .lol-text {
      color: #00ff88;
      font-size: 0.9rem;
      letter-spacing: 3px;
      animation: pulse 0.8s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #loadingSection { display: block; }
    #loadingSection.hide { display: none; }
  </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
  <!-- FASE 1: PANTALLA FALSA DE CARGA -->
  <div id="loadingSection">
    <div class="warning-box">
      <div class="skull">💀</div>
      <h1>ALERTA DE SEGURIDAD</h1>
      <p class="subtitle">ANALIZANDO SISTEMA... POR FAVOR ESPERE</p>

      <div class="progress-label" id="progressLabel">ESCANEANDO ARCHIVOS...</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="status-text" id="statusText">Iniciando análisis...</div>
    </div>
  </div>

  <!-- FASE 2: RICKROLL -->
  <div id="rickContainer">
    <div class="rick-title">☠ SIKEEE ☠</div>
    <iframe
      id="rickVideo"
      width="560"
      height="315"
      src=""
      title="Rick Roll"
      frameborder="0"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
    <div class="lol-text">[ ERES EL ELEGIDO. FELICIDADES. ]</div>
  </div>
</div>

<script>
  // Matrix rain
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const cols = Math.floor(canvas.width / 16);
  const drops = Array(cols).fill(1);
  function drawMatrix() {
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ff88';
    ctx.font = '14px monospace';
    drops.forEach((y, i) => {
      const text = String.fromCharCode(0x30A0 + Math.random() * 96);
      ctx.fillText(text, i * 16, y * 16);
      if (y * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    });
  }
  setInterval(drawMatrix, 50);

  // Fake loading messages
  const messages = [
    "Iniciando análisis...",
    "Detectando vulnerabilidades...",
    "Accediendo a archivos del sistema...",
    "Error crítico encontrado...",
    "Intentando recuperar datos...",
    "Conexión establecida con servidor remoto...",
    "Descargando payload...",
    "Preparando sorpresa especial...",
    "Listo. 😈"
  ];

  const statusEl = document.getElementById('statusText');
  const labelEl = document.getElementById('progressLabel');
  let msgIndex = 0;

  const msgInterval = setInterval(() => {
    if (msgIndex < messages.length) {
      statusEl.textContent = messages[msgIndex];
      if (msgIndex === 5) labelEl.textContent = "CARGANDO ARCHIVO ESPECIAL...";
      if (msgIndex === 7) labelEl.textContent = "COMPLETANDO...";
      msgIndex++;
    } else {
      clearInterval(msgInterval);
    }
  }, 450);

  // After 4.5s, show the Rick Roll
  setTimeout(() => {
    document.getElementById('loadingSection').classList.add('hide');
    const rc = document.getElementById('rickContainer');
    rc.classList.add('show');
    // Set src here so autoplay triggers
    document.getElementById('rickVideo').src =
      "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1";
  }, 4500);
</script>
</body>
</html>
